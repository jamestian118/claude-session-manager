[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-manager"
version = "0.1.0"
description = "Unified session manager for Claude, Codex, and Gemini CLI tools."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "mcp>=1.26.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-cov>=7.0.0,<8",
]

[project.scripts]
csm = "csm:main"

[tool.setuptools]
py-modules = ["csm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
